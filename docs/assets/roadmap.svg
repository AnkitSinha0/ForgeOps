<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">ForgeOps roadmap</title><desc id="desc">Fourteen phases from foundation to a self-hostable release; phases below 1 are done, phase 1 is next, phase 6 (gVisor isolation) is the centrepiece.</desc><style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;white-space:pre;}
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite;}
.flow-slow{stroke-dasharray:2 8;animation:flow 2.4s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-20;}}
.blink{animation:blink 1.06s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.breathe{animation:breathe 3.6s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.55;}50%{opacity:1;}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite;}
@keyframes ping{0%{transform:scale(1);opacity:.75;}80%,100%{transform:scale(2.4);opacity:0;}}
.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 2.8s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1,1);}30%{transform:scale(.97,1.05);}55%{transform:scale(1.02,.97);}80%{transform:scale(.99,1.03);}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F1626"/><stop offset="1" stop-color="#090D16"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1A2338"/></pattern><radialGradient id="vig"><stop offset="0" stop-color="#EA580C" stop-opacity=".13"/><stop offset="1" stop-color="#EA580C" stop-opacity="0"/></radialGradient><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ember" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#F97316"/></linearGradient><clipPath id="frame"><rect x="0" y="0" width="1000" height="350" rx="18"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="1000" height="350" rx="18" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1000" height="350" rx="18" fill="url(#dots)" stroke="none" stroke-width="1" opacity=".55"/><ellipse cx="160" cy="0" rx="550" ry="210" fill="url(#vig)"/></g><rect x="0.5" y="0.5" width="999" height="349" rx="18" fill="none" stroke="#1B2436" stroke-width="1"/><text x="36" y="46" font-size="11" fill="#FB923C" font-weight="700" text-anchor="start" letter-spacing="2.2">ROADMAP</text><text x="36" y="75" font-size="21" fill="#E8ECF4" font-weight="650" text-anchor="start">Fourteen phases to a demo-ready PaaS, January 2027</text><g><rect x="763.8" y="57" width="200.2" height="22" rx="11" fill="#FB923C" stroke="#FB923C" stroke-width="1" fill-opacity=".12" stroke-opacity=".55"/><text x="863.9" y="71.96" font-size="11" fill="#FB923C" font-weight="500" text-anchor="middle" class="m">Phase 0 done · Phase 1 next</text></g><path d="M96,160 H900 C956,160 956,270 900,270 H96" fill="none" stroke="#35405C" stroke-width="2" stroke-linecap="round"/><path d="M96,160 H900 C956,160 956,270 900,270 H96" fill="none" stroke="#5F6A84" stroke-width="2" stroke-linecap="round" class="flow-slow" opacity=".6"/><path d="M96,160 H230" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/><circle cx="96" cy="160" r="15" fill="#34D399"/><path d="M90,160 l4,4.5 l8,-9" fill="none" stroke="#062B1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="200" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Foundation</text><circle cx="230" cy="160" r="15" fill="#FB923C" class="ping"/><circle cx="230" cy="160" r="15" fill="#FB923C" filter="url(#glow)"/><text x="230" y="164.5" font-size="12" fill="#2A1204" font-weight="800" text-anchor="middle">1</text><text x="230" y="200" font-size="11.5" fill="#E8ECF4" font-weight="600" text-anchor="middle">Domain model</text><circle cx="364" cy="160" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="364" y="164.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">2</text><text x="364" y="200" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">API + tenancy</text><circle cx="498" cy="160" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="498" y="164.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">3</text><text x="498" y="200" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Git + HMAC</text><circle cx="632" cy="160" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="632" y="164.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">4</text><text x="632" y="200" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Build executor</text><circle cx="766" cy="160" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="766" y="164.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">5</text><text x="766" y="200" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Deploy + router</text><circle cx="900" cy="160" r="22" fill="none" stroke="#FB923C" stroke-width="1.2" stroke-dasharray="3 3" class="breathe"/><circle cx="900" cy="160" r="15" fill="#0B1020" stroke="#FB923C" stroke-width="1.5"/><text x="900" y="164.5" font-size="12" fill="#FB923C" font-weight="700" text-anchor="middle">6</text><text x="900" y="200" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">gVisor sandbox</text><text x="900" y="216" font-size="10" fill="#FB923C" font-weight="600" text-anchor="middle" letter-spacing="1">centrepiece</text><circle cx="900" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="900" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">7</text><text x="900" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Build cache</text><circle cx="766" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="766" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">8</text><text x="766" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Log streaming</text><circle cx="632" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="632" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">9</text><text x="632" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Quotas + domains</text><circle cx="498" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="498" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">10</text><text x="498" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Observability</text><circle cx="364" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="364" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">11</text><text x="364" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Load + chaos</text><circle cx="230" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="230" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">12</text><text x="230" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Dashboard</text><circle cx="96" cy="270" r="15" fill="#0B1020" stroke="#35405C" stroke-width="1.5"/><text x="96" y="274.5" font-size="12" fill="#98A3B9" font-weight="700" text-anchor="middle">13</text><text x="96" y="310" font-size="11.5" fill="#98A3B9" font-weight="500" text-anchor="middle">Ship + docs</text></svg>
