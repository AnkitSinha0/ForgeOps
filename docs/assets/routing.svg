text><text x="310" y="294" font-size="12.5" fill="#E8ECF4" font-weight="600" text-anchor="start">Reverse proxy</text><text x="310" y="311" font-size="10" fill="#98A3B9" font-weight="400" text-anchor="start" class="m">httputil.ReverseProxy · streams bodies</text><rect x="270" y="340" width="290" height="70" rx="9" fill="#0A0F1A" stroke="#232D43" stroke-width="1"/><text x="286" y="360" font-size="9.5" fill="#5F6A84" font-weight="700" text-anchor="start" letter-spacing="1.6">LOCAL MAP</text><text x="286" y="386" font-size="11.5" fill="#E8ECF4" font-weight="500" text-anchor="start" class="m">acme-web.forgeops.dev</text><text x="444.7" y="386" font-size="11.5" fill="#FB923C" font-weight="600" text-anchor="start" class="m" opacity="0" style="animation:k1 12.0s linear infinite;">→ v3</text><text x="444.7" y="386" font-size="11.5" fill="#34D399" font-weight="600" text-anchor="start" class="m" style="animation:k2 12.0s linear infinite;">→ v2</text><rect x="270" y="340" width="290" height="70" rx="9" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0" style="animation:k3 12.0s linear infinite;"/><text x="286" y="402" font-size="9.5" fill="#5F6A84" font-weight="400" text-anchor="start" class="m">rebuilt on every invalidation</text><rect x="250" y="470" width="330" height="64" rx="12" fill="#0A1A20" stroke="#22D3EE" stroke-width="1" stroke-opacity=".5"/><text x="270" y="496" font-size="13.5" fill="#E8ECF4" font-weight="600" text-anchor="start">Redis registry</text><text x="270" y="514" font-size="10.5" fill="#98A3B9" font-weight="400" text-anchor="start" class="m">host → deployment · the source of truth</text><rect x="250" y="470" width="330" height="64" rx="12" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0" style="animation:k4 12.0s linear infinite;"/><path d="M415,470 V436" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><polygon points="410.5,438.3 419.5,438.3 415,432" fill="#22D3EE"/><text x="424" y="456" f